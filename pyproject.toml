[project]
name = "sf6-color-collection-builder"
version = "0.2.0"
description = "Windows desktop tool for building SF6 color-slot collection mods."
requires-python = ">=3.11"
dependencies = [
    "py7zr>=1.1",
    "PySide6>=6.7",
    "rarfile>=4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
